<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pergunta do dia 💛</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fff7f0;--ink:#4a2433;--soft:#8a5a6b;--sun:#ffc93c;--sun2:#e8578a;--leaf:#d4900a;--card:#fffdf9;--line:#f6d9de;--pink:#f7a8c0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Lora',Georgia,serif;min-height:100vh;
    background-image:radial-gradient(circle at 8% 0%,#ffe7a3 0,transparent 42%),radial-gradient(circle at 95% 100%,#ffc9d9 0,transparent 48%),radial-gradient(circle at 100% 20%,#ffe1ea 0,transparent 30%)}
  .script{font-family:'Dancing Script',cursive}
  button{font-family:inherit;cursor:pointer}
  .hidden{display:none!important}

  /* tela cheia (senha / quem é você) */
  .full{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:radial-gradient(circle at 15% 10%,#ffe7a3 0,transparent 45%),radial-gradient(circle at 90% 90%,#ffc9d9 0,transparent 50%),var(--bg);z-index:20}
  .full h1{font-size:2.4rem;color:var(--sun2);margin:16px 0 6px}
  .full p{color:var(--soft);font-style:italic;margin-bottom:22px}
  .inputs{display:flex;gap:10px;align-items:center;justify-content:center}
  .inputs input{width:64px;height:64px;font-size:1.6rem;text-align:center;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);font-family:inherit;outline:none}
  .inputs input:focus{border-color:var(--sun)}
  .inputs span{font-size:1.6rem;color:var(--soft)}
  .msg{min-height:24px;margin-top:14px;color:#b5541c;font-size:.95rem}
  .shake{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
  .spin{animation:spin 18s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  .who{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .btn{background:linear-gradient(135deg,#ffc93c,#f7a8c0);color:#4a2433;border:none;border-radius:999px;padding:12px 22px;font-size:1rem;font-weight:600;box-shadow:0 4px 0 #e58aa6}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #e58aa6}
  .btn.ghost{background:transparent;box-shadow:none;border:2px solid var(--line);color:var(--soft);font-weight:400}
  .btn:disabled{opacity:.5}

  /* app */
  main{max-width:560px;margin:0 auto;padding:28px 18px 60px}
  header{text-align:center;margin-bottom:22px}
  header h1{font-size:2.3rem;color:var(--sun2)}
  header .date{color:var(--soft);font-style:italic}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 20px;box-shadow:0 10px 30px rgba(200,90,130,.12);margin-bottom:18px}
  .label{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--leaf);font-weight:600}
  .tema{font-size:1.6rem;margin:4px 0 14px;color:var(--ink)}
  .frase{font-style:italic;font-size:1.12rem;line-height:1.6;color:var(--soft);border-left:3px solid var(--pink);padding-left:14px;margin-bottom:18px;white-space:pre-wrap}
  .pergunta{font-size:1.2rem;font-weight:600;line-height:1.45;margin:6px 0 4px}
  .ans{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
  .ans h3{font-size:.95rem;color:var(--leaf);margin-bottom:6px}
  .ans p{white-space:pre-wrap;line-height:1.55}
  .locked{color:var(--soft);font-style:italic}
  textarea,input.f{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;font-family:inherit;font-size:1rem;background:#fff;color:var(--ink);outline:none;resize:vertical}
  textarea:focus,input.f:focus{border-color:var(--sun)}
  textarea{min-height:96px}
  .row{display:flex;gap:10px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
  .link{background:none;border:none;color:var(--soft);text-decoration:underline;font-size:.9rem}
  .empty{text-align:center;color:var(--soft);font-style:italic;line-height:1.6}
  h2.sec{font-size:1.1rem;color:var(--soft);margin:30px 0 12px;font-weight:400;font-style:italic;text-align:center}
  details.past{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;padding:14px 16px}
  details.past summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
  details.past summary::-webkit-details-marker{display:none}
  details.past summary b{font-weight:600}
  details.past summary span{color:var(--soft);font-size:.9rem;white-space:nowrap}
  details.past[open] summary{margin-bottom:12px}
  .field{margin-bottom:12px;text-align:left}
  .field label{display:block;font-size:.85rem;color:var(--soft);margin-bottom:4px}
  .banner{background:#fff1f4;border:1px dashed var(--sun2);color:var(--soft);font-size:.85rem;padding:8px 12px;border-radius:12px;text-align:center;margin-bottom:16px}
  footer{text-align:center;margin-top:30px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute"><defs><g id="sf">
  <g fill="#f7a8c0"><circle cx="50" cy="24" r="17"/><circle cx="74.7" cy="42" r="17"/><circle cx="65.3" cy="71" r="17"/><circle cx="34.7" cy="71" r="17"/><circle cx="25.3" cy="42" r="17"/></g>
  <g fill="#fbc5d5"><circle cx="50" cy="28" r="9"/><circle cx="70.9" cy="43.2" r="9"/><circle cx="62.9" cy="67.8" r="9"/><circle cx="37.1" cy="67.8" r="9"/><circle cx="29.1" cy="43.2" r="9"/></g>
  <circle cx="50" cy="50" r="15" fill="#ffc93c"/><circle cx="50" cy="50" r="9" fill="#f5a700"/>
</g></defs></svg>

<!-- 1. Senha -->
<div id="lock" class="full">
  <svg class="spin" width="100" height="100" viewBox="0 0 100 100"><use href="#sf"/></svg>
  <h1 class="script">Pergunta do dia</h1>
  <p>A mesma senha de sempre: o dia do nosso primeiro beijo.</p>
  <div class="inputs" id="inputs">
    <input id="dd" inputmode="numeric" maxlength="2" placeholder="dia" aria-label="dia">
    <span>/</span>
    <input id="mm" inputmode="numeric" maxlength="2" placeholder="mês" aria-label="mês">
  </div>
  <div class="msg" id="lockMsg"></div>
</div>

<!-- 2. Quem é você -->
<div id="whoScreen" class="full hidden">
  <svg width="80" height="80" viewBox="0 0 100 100"><use href="#sf"/></svg>
  <h1 class="script">Quem tá aí?</h1>
  <p>Só pra eu saber de quem é cada resposta.</p>
  <div class="who">
    <button class="btn" id="beLarissa">Sou a Larissa 💛</button>
    <button class="btn ghost" id="beLucas">Sou o Lucas</button>
  </div>
  <div id="pinBox" class="hidden" style="margin-top:22px">
    <input class="f" id="pin" type="password" inputmode="numeric" placeholder="PIN do Lucas" style="max-width:200px;text-align:center">
    <div class="row" style="justify-content:center"><button class="btn" id="pinOk">Entrar</button></div>
    <div class="msg" id="pinMsg"></div>
  </div>
</div>

<!-- 3. App -->
<main id="app" class="hidden">
  <div id="demo" class="banner hidden">Modo de teste: as respostas ficam só neste navegador. O banco de dados não está configurado.</div>
  <header>
    <svg width="54" height="54" viewBox="0 0 100 100" class="spin"><use href="#sf"/></svg>
    <h1 class="script" id="hello">Oi!</h1>
    <div class="date" id="todayLabel"></div>
  </header>

  <section id="today"></section>

  <!-- editor do Lucas -->
  <section id="editor" class="card hidden">
    <div class="label" style="margin-bottom:14px">Escrever um dia</div>
    <div class="field"><label>Data</label><input class="f" type="date" id="edDate"></div>
    <div class="field"><label>Tema</label><input class="f" id="edTema" placeholder="ex.: Primeiras vezes"></div>
    <div class="field"><label>Frase ou citação</label><textarea id="edFrase" placeholder="O que você quer dizer pra ela hoje"></textarea></div>
    <div class="field"><label>Pergunta</label><input class="f" id="edPerg" placeholder="ex.: Qual foi a primeira coisa que você reparou em mim?"></div>
    <div class="row" style="justify-content:space-between">
      <button class="link" id="suggest">✨ me dá uma ideia</button>
      <div style="display:flex;gap:10px"><button class="btn ghost" id="edCancel">Cancelar</button><button class="btn" id="edSave">Salvar</button></div>
    </div>
  </section>

  <h2 class="sec" id="pastTitle">Dias anteriores</h2>
  <section id="past"></section>

  <footer><button class="link" id="switchWho">trocar de pessoa</button></footer>
</main>

<div class="toast" id="toast"></div>

<script type="module">
/* =====================================================================
   CONFIGURAÇÃO — é só isso que você precisa mexer
   ===================================================================== */
const LUCAS_PIN = "3718";          // PIN pra entrar como Lucas (troque!)
const SUPABASE_URL = "https://vexckguciruxoqcmeoel.supabase.co";
const SUPABASE_KEY = "sb_publishable_RD7aJIr3M5c7son7uMHJXA_5_1TlWN9";   // chave pública (publishable)
const TABELA = "pdd_dias";
/* ===================================================================== */

const NAMES = {lucas: "Lucas", larissa: "Larissa"};
const OTHER = {lucas: "larissa", larissa: "lucas"};
const IDEIAS = [
  {tema:"Primeiras impressões", frase:"Tem gente que a gente vai conhecendo aos poucos. Você eu conheci de uma vez, e mesmo assim continuo descobrindo coisa nova todo dia.", pergunta:"Qual foi a primeira coisa que você reparou em mim?"},
  {tema:"Intenção", frase:"Amor é intencional, não acidental. Então hoje eu escolho reparar em você de propósito.", pergunta:"Qual coisa pequena alguém pode fazer que te faz se sentir cuidada?"},
  {tema:"O que ilumina", frase:"Tem dias que são cinza, e aí eu lembro de você e eles ficam um pouco mais amarelos.", pergunta:"O que sempre te faz sorrir, mesmo num dia ruim?"},
  {tema:"Lugares", frase:"Lugar bom é qualquer um que tenha você do lado.", pergunta:"Se a gente pudesse estar em qualquer lugar agora, onde seria?"},
  {tema:"Infância", frase:"Quero te conhecer inteira, inclusive a menina que você foi.", pergunta:"Qual memória de criança você guarda com mais carinho?"},
  {tema:"Coragem", frase:"Coragem não é não ter medo. É ir mesmo com ele.", pergunta:"Tem alguma coisa que você quer muito fazer, mas ainda dá um friozinho na barriga?"},
  {tema:"Próximos passos", frase:"Não preciso saber o futuro inteiro. Me basta saber que o próximo encontro é com você.", pergunta:"O que você quer que a gente faça junto ainda esse mês?"}
];

/* ---------- utilidades ---------- */
const $ = id => document.getElementById(id);
const ls = {get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}}, del(k){try{localStorage.removeItem(k)}catch{}}};
const pad = n => String(n).padStart(2,"0");
const todayId = () => {const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const fmt = (id, opts) => new Date(id+"T12:00:00").toLocaleDateString("pt-BR", opts);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){const el=$("toast");el.textContent=t;el.classList.add("on");setTimeout(()=>el.classList.remove("on"),2200)}

/* ---------- armazenamento (Supabase ou modo de teste) ---------- */
let store, days = {};
async function initStore(){
  if (SUPABASE_URL && SUPABASE_KEY){
    const {createClient} = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
    let cb = ()=>{};
    async function load(){
      const {data, error} = await sb.from(TABELA).select("*");
      if (error) { toast("Erro ao carregar: " + error.message); return; }
      const o = {}; (data||[]).forEach(r => o[r.id] = r); cb(o);
    }
    store = {
      subscribe(f){
        cb = f; load();
        sb.channel("pdd").on("postgres_changes", {event:"*", schema:"public", table:TABELA}, () => load()).subscribe();
        document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
      },
      async save(id, data){
        const {data:cur, error:e1} = await sb.from(TABELA).select("*").eq("id", id).maybeSingle();
        if (e1) throw e1;
        const row = {...(cur||{}), ...data, id,
          respostas: {...(cur?.respostas||{}), ...(data.respostas||{})},
          updated_at: new Date().toISOString()};
        const {error} = await sb.from(TABELA).upsert(row);
        if (error) throw error;
        await load();
      }
    };
  } else {
    $("demo").classList.remove("hidden");
    let cb = ()=>{};
    const read = () => { try{ return JSON.parse(ls.get("pdd_demo")||"{}") }catch{ return {} } };
    store = {
      subscribe(f){ cb=f; f(read()); },
      async save(id, data){
        const all = read(); const cur = all[id] || {};
        all[id] = {...cur, ...data, respostas:{...(cur.respostas||{}), ...(data.respostas||{})}};
        ls.set("pdd_demo", JSON.stringify(all)); cb(all);
      }
    };
  }
}

/* ---------- senha ---------- */
const dd=$("dd"), mm=$("mm"); let tries=0;
const tips=["Hmm… não foi esse dia 🙈","Pensa mais um pouquinho…","Dica: foi em agosto 💛"];
dd.addEventListener("input",()=>{dd.value=dd.value.replace(/\D/g,"");if(dd.value.length===2)mm.focus();check()});
mm.addEventListener("input",()=>{mm.value=mm.value.replace(/\D/g,"");check()});
mm.addEventListener("keydown",e=>{if(e.key==="Backspace"&&!mm.value)dd.focus()});
function check(){
  if(!dd.value||!mm.value)return;
  if(+dd.value===15&&+mm.value===8){ls.set("pdd_ok","1");return afterLock()}
  if(mm.value.length===2){$("lockMsg").textContent=tips[Math.min(tries++,2)];const i=$("inputs");i.classList.remove("shake");void i.offsetWidth;i.classList.add("shake");setTimeout(()=>{dd.value="";mm.value="";dd.focus()},500)}
}

/* ---------- quem é você ---------- */
let me = null;
function afterLock(){
  $("lock").classList.add("hidden");
  me = ls.get("pdd_me");
  if(me==="lucas"||me==="larissa") startApp(); else $("whoScreen").classList.remove("hidden");
}
$("beLarissa").onclick=()=>{me="larissa";ls.set("pdd_me",me);$("whoScreen").classList.add("hidden");startApp()};
$("beLucas").onclick=()=>{$("pinBox").classList.remove("hidden");$("pin").focus()};
$("pinOk").onclick=()=>{ if($("pin").value===LUCAS_PIN){me="lucas";ls.set("pdd_me",me);$("whoScreen").classList.add("hidden");startApp()} else $("pinMsg").textContent="PIN errado 🤔" };
$("pin").addEventListener("keydown",e=>{if(e.key==="Enter")$("pinOk").click()});
$("switchWho").onclick=()=>{ls.del("pdd_me");location.reload()};

/* ---------- app ---------- */
let started=false, editingAnswer=false;
async function startApp(){
  if(started)return; started=true;
  $("app").classList.remove("hidden");
  $("hello").textContent = me==="larissa" ? "Oi, Larissa 💛" : "Oi, Lucas";
  {const t=fmt(todayId(),{weekday:"long",day:"numeric",month:"long"});$("todayLabel").textContent=t[0].toUpperCase()+t.slice(1);}
  await initStore();
  store.subscribe(o=>{days=o;render()});
}

function answersBlock(id, d, interactive){
  const r = d.respostas || {}, mine = r[me], theirs = r[OTHER[me]], both = mine && theirs;
  let h = "";
  // minha resposta
  if(mine && !(interactive && editingAnswer)){
    h += `<div class="ans"><h3>Sua resposta</h3><p>${esc(mine.texto)}</p>${interactive && !theirs ? `<div class="row"><button class="link" data-act="edit">editar</button></div>`:""}</div>`;
  } else if(interactive){
    h += `<div class="ans"><h3>Sua resposta</h3><textarea id="myAns" placeholder="Escreve aqui…">${esc(mine?.texto||"")}</textarea>
          <div class="row"><button class="btn" data-act="send">${mine?"Salvar":"Responder"}</button></div></div>`;
  } else {
    h += `<div class="ans"><h3>${NAMES[me]}</h3><p class="locked">não respondeu</p></div>`;
  }
  // resposta do outro
  const on = NAMES[OTHER[me]];
  if(both) h += `<div class="ans"><h3>${on}</h3><p>${esc(theirs.texto)}</p></div>`;
  else if(theirs) h += `<div class="ans"><h3>${on}</h3><p class="locked">🔒 ${on==="Larissa"?"A Larissa":"O Lucas"} já respondeu. Responde também pra ver!</p></div>`;
  else h += `<div class="ans"><h3>${on}</h3><p class="locked">${interactive ? `Esperando ${on==="Larissa"?"a Larissa":"o Lucas"} responder…` : "não respondeu"}</p></div>`;
  return h;
}

function render(){
  const tid = todayId(), d = days[tid];
  let h = "";
  if(d){
    h += `<div class="card"><div class="label">Tema de hoje</div><div class="tema">${esc(d.tema)}</div>
          ${d.frase?`<div class="frase">${esc(d.frase)}</div>`:""}
          <div class="label">Pergunta</div><div class="pergunta">${esc(d.pergunta)}</div>
          ${answersBlock(tid,d,true)}</div>`;
  } else {
    h += `<div class="card empty">${me==="lucas" ? "Você ainda não escreveu o dia de hoje." : "O Lucas ainda não escreveu o tema de hoje…<br>volta daqui a pouquinho 💛"}</div>`;
  }
  if(me==="lucas") h += `<div class="row" style="justify-content:center;margin-bottom:8px"><button class="btn" data-act="write">${d?"✏️ Editar o dia de hoje":"✏️ Escrever o dia"}</button><button class="btn ghost" data-act="writeOther">Agendar outro dia</button></div>`;
  $("today").innerHTML = h;

  // dias anteriores (e, pro Lucas, os agendados)
  const ids = Object.keys(days).sort().reverse();
  const past = ids.filter(i=>i<tid), future = ids.filter(i=>i>tid);
  let p = "";
  if(me==="lucas" && future.length){
    p += future.reverse().map(i=>`<details class="past"><summary><b>⏳ ${esc(days[i].tema)}</b><span>${fmt(i,{day:"numeric",month:"short"})}</span></summary>
      <div class="frase">${esc(days[i].frase)}</div><div class="pergunta">${esc(days[i].pergunta)}</div>
      <div class="row"><button class="link" data-act="editDay" data-id="${i}">editar</button></div></details>`).join("");
  }
  p += past.map(i=>{const x=days[i];return `<details class="past"><summary><b>${esc(x.tema)}</b><span>${fmt(i,{day:"numeric",month:"short"})}</span></summary>
      ${x.frase?`<div class="frase">${esc(x.frase)}</div>`:""}<div class="pergunta">${esc(x.pergunta)}</div>${answersBlock(i,x,false)}</details>`}).join("");
  $("past").innerHTML = p;
  $("pastTitle").classList.toggle("hidden", !p);
}

/* ---------- ações ---------- */
document.addEventListener("click", async e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act, tid = todayId();
  if(act==="send"){
    const t = $("myAns").value.trim(); if(!t) return toast("Escreve alguma coisinha 🙂");
    b.disabled=true;
    try{ await store.save(tid,{respostas:{[me]:{texto:t,em:Date.now()}}}); editingAnswer=false; toast("Resposta salva 💛") }
    catch(err){ toast("Não consegui salvar 😕 " + (err?.message||"")); b.disabled=false }
  }
  if(act==="edit"){ editingAnswer=true; render(); }
  if(act==="write") openEditor(tid);
  if(act==="writeOther"){ const t=new Date(); t.setDate(t.getDate()+1); openEditor(`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`); }
  if(act==="editDay") openEditor(b.dataset.id);
});

let ideaIdx = Math.floor(Math.random()*IDEIAS.length);
function openEditor(id){
  const d = days[id] || {};
  $("edDate").value=id; $("edTema").value=d.tema||""; $("edFrase").value=d.frase||""; $("edPerg").value=d.pergunta||"";
  $("editor").classList.remove("hidden"); $("editor").scrollIntoView({behavior:"smooth"});
}
$("edDate").onchange=()=>{const d=days[$("edDate").value]||{};$("edTema").value=d.tema||"";$("edFrase").value=d.frase||"";$("edPerg").value=d.pergunta||""};
$("suggest").onclick=()=>{const i=IDEIAS[ideaIdx++%IDEIAS.length];$("edTema").value=i.tema;$("edFrase").value=i.frase;$("edPerg").value=i.pergunta};
$("edCancel").onclick=()=>$("editor").classList.add("hidden");
$("edSave").onclick=async()=>{
  const id=$("edDate").value, tema=$("edTema").value.trim(), pergunta=$("edPerg").value.trim(), frase=$("edFrase").value.trim();
  if(!id||!tema||!pergunta) return toast("Preenche pelo menos data, tema e pergunta");
  try{ await store.save(id,{tema,frase,pergunta}); $("editor").classList.add("hidden"); toast(id===todayId()?"Dia de hoje publicado 💛":"Agendado para "+fmt(id,{day:"numeric",month:"short"})); window.scrollTo({top:0,behavior:"smooth"}) }
  catch(err){ toast("Não consegui salvar 😕 " + (err?.message||"")) }
};

/* ---------- início ---------- */
if(ls.get("pdd_ok")==="1") afterLock(); else dd.focus();
</script>
</body>
</html>
